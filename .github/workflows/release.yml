name: release

on:
  release:
    types:
      - published

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true
  NUGET_XMLDOC_MODE: skip
  BUILD_OUTPUT: ${{ github.workspace }}/dist

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6

      - name: Build (Debug)
        run: dotnet build -tl -c Debug

      - name: Build (Release)
        run: dotnet build -tl -c Release

      - name: Run tests
        run: dotnet test -tl -c Release --no-build

      - name: Create NuGet packages
        run: dotnet pack -tl -c Release --no-build -o "${{ env.BUILD_OUTPUT }}"

      - name: Fetch NuGet API Key
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ github.repository_owner }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build
          if-no-files-found: error
          path: ${{ env.BUILD_OUTPUT }}/*.nupkg

      - name: Upload NuGets to GitHub
        uses: Kira-NT/mc-publish@v3
        with:
          files: ${{ env.BUILD_OUTPUT }}/*.nupkg
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload NuGets to NuGet.org
        run: dotnet nuget push "${{ env.BUILD_OUTPUT }}/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
